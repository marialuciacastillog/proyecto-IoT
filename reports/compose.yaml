
services:
  # API de reportes
  api:
    build: .
    container_name: iot-reports-api
    restart: unless-stopped

    command:
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

    environment:
      DATABASE_URL: postgresql://postgres:postgres@central_postgres_db:5432/central_db
      # Para generar los links de descarga de S3
      REPORTS_BUCKET_NAME: ${REPORTS_BUCKET_NAME}
      AWS_DEFAULT_REGION: us-east-1
      AWS_PROFILE: lab1
      AWS_SHARED_CREDENTIALS_FILE: /root/.aws/credentials
      AWS_CONFIG_FILE: /root/.aws/config

    volumes:
      - ${HOME}/.aws:/root/.aws:ro

    ports:
      - "8000:8000"

    networks:
      - iot-central-network

  # Publicador de solicitudes a SQS
  publisher:
    build: .
    container_name: iot-reports-publisher
    restart: unless-stopped

    command:
      - python
      - -m
      - api.publisher

    environment:
      DATABASE_URL: postgresql://postgres:postgres@central_postgres_db:5432/central_db
      REPORTS_QUEUE_URL: ${REPORTS_QUEUE_URL}
      REPORTS_BUCKET_NAME: ${REPORTS_BUCKET_NAME}
      REPORTS_VISIBILITY_SECONDS: "120"
      AWS_DEFAULT_REGION: us-east-1
      AWS_PROFILE: lab1
      AWS_SHARED_CREDENTIALS_FILE: /root/.aws/credentials
      AWS_CONFIG_FILE: /root/.aws/config

    volumes:
      - ${HOME}/.aws:/root/.aws:ro

    networks:
      - iot-central-network

  # Worker que genera CSV y los guarda en S3
  worker:
    build: .
    container_name: iot-reports-worker
    restart: unless-stopped

    command:
      - python
      - -m
      - worker.main

    environment:
      DATABASE_URL: postgresql://postgres:postgres@central_postgres_db:5432/central_db
      REPORTS_QUEUE_URL: ${REPORTS_QUEUE_URL}
      REPORTS_BUCKET_NAME: ${REPORTS_BUCKET_NAME}
      REPORTS_VISIBILITY_SECONDS: "120"
      AWS_DEFAULT_REGION: us-east-1
      AWS_PROFILE: lab1
      AWS_SHARED_CREDENTIALS_FILE: /root/.aws/credentials
      AWS_CONFIG_FILE: /root/.aws/config

    volumes:
      - ${HOME}/.aws:/root/.aws:ro

    networks:
      - iot-central-network

networks:
  iot-central-network:
    external: true
    name: iot-central-network

