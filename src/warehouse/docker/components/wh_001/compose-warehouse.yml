
services:
  wh_001_postgres_db:
    image: postgres:15-alpine
    container_name: db_warehouse_${WH_ID}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warehouse_db
    ports:
      - "${DB_PORT}:5432"
    # volumes:
      # - postgres_data_${WH_ID}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  wh_001_warehouse_api:
    build:
      context: ./src/backend/app
      dockerfile: Dockerfile
    container_name: warehouse_api_node_${WH_ID}
    ports:
      - "${BE_PORT}:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@wh_001_postgres_db:5432/warehouse_db
      - WAREHOUSE_ID=warehouse
    depends_on:
      wh_001_postgres_db:
        condition: service_healthy

  wh_001_warehouse_frontend:
    build:
      context: ./src/frontend/app
      dockerfile: Dockerfile
    container_name: warehouse_frontend_node_${WH_ID}
    ports:
      - "${FE_PORT}:80"
    environment:
      - API_TARGET=wh_001_warehouse_api:8000
    # Mapeamos la ruta /api de forma transparente mediante Nginx para no requerir configuraciones cruzadas de puertos
    depends_on:
      - wh_001_warehouse_api