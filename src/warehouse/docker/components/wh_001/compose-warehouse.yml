
services:
  wh_001_postgres_db:
    image: postgres:15-alpine
    container_name: db_warehouse_${WH_ID}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warehouse_db
    ports:
      - "${DB_PORT}:5432"
    # volumes:
      # - postgres_data_${WH_ID}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Fase 5: la API ya no se expone directo; se entra por el balanceador (wh_001_lb)
  wh_001_warehouse_api:
    build:
      context: ./src/backend/app
      dockerfile: Dockerfile
    container_name: warehouse_api_node_${WH_ID}
    deploy:
      replicas: 1
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@wh_001_postgres_db:5432/warehouse_db
      - WAREHOUSE_ID=wh-001
      - REDIS_URL=redis://wh_001_redis:6379/0
      - CACHE_TTL_SECONDS=30
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
    depends_on:
      wh_001_postgres_db:
        condition: service_healthy
      wh_001_redis:
        condition: service_started

  # Fase 5: balanceador de carga (Nginx). Es la única puerta de entrada a la API de la bodega
  wh_001_lb:
    image: nginx:1.27-alpine
    container_name: lb_${WH_ID}
    ports:
      - "${BE_PORT}:80"
    environment:
      - API_HOST=wh_001_warehouse_api
    volumes:
      - ./docker/components/nginx/load-balancer.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - wh_001_warehouse_api

  # Fase 2: Redis propio de esta bodega (caché de las consultas de inventario)
  wh_001_redis:
    image: redis:7-alpine
    container_name: redis_${WH_ID}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  wh_001_warehouse_frontend:
    build:
      context: ./src/frontend/app
      dockerfile: Dockerfile
    container_name: warehouse_frontend_node_${WH_ID}
    ports:
      - "${FE_PORT}:80"
    environment:
      - API_TARGET=wh_001_lb:80
    # Mapeamos la ruta /api de forma transparente mediante Nginx para no requerir configuraciones cruzadas de puertos
    depends_on:
      - wh_001_lb

  # Publicador: envía los eventos pendientes de esta bodega a la cola SQS
  wh_001_publisher:
    build:
      context: ./src/backend/app
      dockerfile: Dockerfile
    container_name: publisher_${WH_ID}
    command: python -m app.modules.sync.publisher
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@wh_001_postgres_db:5432/warehouse_db
      - WAREHOUSE_ID=wh-001
      - SYNC_QUEUE_URL=${SYNC_QUEUE_URL}
      - AWS_PROFILE=lab1
      - AWS_DEFAULT_REGION=us-east-1
      - PYTHONUNBUFFERED=1
    volumes:
      - ~/.aws:/root/.aws:ro
    depends_on:
      wh_001_postgres_db:
        condition: service_healthy

  # Fase 6: worker de transferencias. Recibe órdenes de la central y las aplica en esta bodega
  wh_001_transfer_worker:
    build:
      context: ./src/backend/app
      dockerfile: Dockerfile
    container_name: transfer_worker_${WH_ID}
    command: python -m app.modules.transfers.worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@wh_001_postgres_db:5432/warehouse_db
      - WAREHOUSE_ID=wh-001
      - REDIS_URL=redis://wh_001_redis:6379/0
      - AWS_PROFILE=lab1
      - AWS_DEFAULT_REGION=us-east-1
      - PYTHONUNBUFFERED=1
    volumes:
      - ~/.aws:/root/.aws:ro
    depends_on:
      wh_001_postgres_db:
        condition: service_healthy
