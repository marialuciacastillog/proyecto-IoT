
services:
  wh_003_postgres_db:
    image: postgres:15-alpine
    container_name: db_warehouse_${WH_ID}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warehouse_db
    ports:
      - "${DB_PORT}:5432"
    # volumes:
      # - postgres_data_${WH_ID}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Fase 5: la API ya no se expone directo; se entra por el balanceador (wh_003_lb)
  wh_003_warehouse_api:
    build:
      context: ./src/backend/app
      dockerfile: Dockerfile
    container_name: warehouse_api_node_${WH_ID}
    deploy:
      replicas: 1
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@wh_003_postgres_db:5432/warehouse_db
      - WAREHOUSE_ID=wh-003
      - REDIS_URL=redis://wh_003_redis:6379/0
      - CACHE_TTL_SECONDS=30
      - CACHE_ENABLED=${CACHE_ENABLED:-true}
      # Etapa A: llave pública para revisar los tokens (la bodega no puede fabricar tokens)
      - JWT_PUBLIC_KEY_PATH=/secrets/jwt_public.pem
    volumes:
      - ${JWT_KEYS_DIR:-/opt/proyecto/secrets}:/secrets:ro
    depends_on:
      wh_003_postgres_db:
        condition: service_healthy
      wh_003_redis:
        condition: service_started

  # Fase 5: balanceador de carga (Nginx). Es la única puerta de entrada a la API de la bodega
  wh_003_lb:
    image: nginx:1.27-alpine
    container_name: lb_${WH_ID}
    ports:
      - "${BE_PORT}:80"
    environment:
      - API_HOST=wh_003_warehouse_api
    volumes:
      - ./docker/components/nginx/load-balancer.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - wh_003_warehouse_api

  # Fase 2: Redis propio de esta bodega (caché de las consultas de inventario)
  wh_003_redis:
    image: redis:7-alpine
    container_name: redis_${WH_ID}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  wh_003_warehouse_frontend:
    build:
      context: ./src/frontend/app
      dockerfile: Dockerfile
    container_name: warehouse_frontend_node_${WH_ID}
    ports:
      - "${FE_PORT}:80"
    environment:
      - API_TARGET=wh_003_lb:80
      - WAREHOUSE_ID=wh-003
      # Etapa A: dónde está el servicio de identidad (IP elástica de la central, la pone Terraform)
      - IDENTITY_TARGET=${CENTRAL_IP:-127.0.0.1}:8008
      # Etapa B: catálogo global de la central
      - CATALOG_TARGET=${CENTRAL_IP:-127.0.0.1}:8007
    # Mapeamos la ruta /api de forma transparente mediante Nginx para no requerir configuraciones cruzadas de puertos
    depends_on:
      - wh_003_lb

  # Publicador: envía los eventos pendientes de esta bodega a la cola SQS
  wh_003_publisher:
    build:
      context: ./src/backend/app
      dockerfile: Dockerfile
    container_name: publisher_${WH_ID}
    command: python -m app.modules.sync.publisher
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@wh_003_postgres_db:5432/warehouse_db
      - WAREHOUSE_ID=wh-003
      - SYNC_QUEUE_URL=${SYNC_QUEUE_URL}
      - SYNC_TOPIC_ARN=${SYNC_TOPIC_ARN}
      - AWS_PROFILE=lab1
      - AWS_DEFAULT_REGION=us-east-1
      - PYTHONUNBUFFERED=1
    volumes:
      - ~/.aws:/root/.aws:ro
    depends_on:
      wh_003_postgres_db:
        condition: service_healthy

  # Fase 6: worker de transferencias. Recibe órdenes de la central y las aplica en esta bodega
  wh_003_transfer_worker:
    build:
      context: ./src/backend/app
      dockerfile: Dockerfile
    container_name: transfer_worker_${WH_ID}
    command: python -m app.modules.transfers.worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@wh_003_postgres_db:5432/warehouse_db
      - WAREHOUSE_ID=wh-003
      - REDIS_URL=redis://wh_003_redis:6379/0
      - AWS_PROFILE=lab1
      - AWS_DEFAULT_REGION=us-east-1
      - PYTHONUNBUFFERED=1
    volumes:
      - ~/.aws:/root/.aws:ro
    depends_on:
      wh_003_postgres_db:
        condition: service_healthy
  # Etapa B: aplica los avisos del catálogo de la central (productos asignados y actualizados)
  wh_003_catalog_worker:
    build:
      context: ./src/backend/app
      dockerfile: Dockerfile
    container_name: catalog_worker_${WH_ID}
    command: python -m app.modules.catalog.worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@wh_003_postgres_db:5432/warehouse_db
      - WAREHOUSE_ID=wh-003
      - REDIS_URL=redis://wh_003_redis:6379/0
      - AWS_PROFILE=lab1
      - AWS_DEFAULT_REGION=us-east-1
      - PYTHONUNBUFFERED=1
    volumes:
      - ~/.aws:/root/.aws:ro
    depends_on:
      wh_003_postgres_db:
        condition: service_healthy
