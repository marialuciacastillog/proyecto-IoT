# Fase 6: transferencias entre bodegas (API + orquestador de la saga).
# Usa la base y la red de la central, así que se prende DESPUÉS de src/central_sync_worker.
services:
  transfers_api:
    build: .
    container_name: central_transfers_api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@central_postgres_db:5432/central_db
      - PYTHONUNBUFFERED=1
    ports:
      - "8010:8000"
    networks:
      - iot-central-network

  transfers_orchestrator:
    build: .
    container_name: central_transfers_orchestrator
    restart: unless-stopped
    command: python orchestrator.py
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@central_postgres_db:5432/central_db
      - AWS_PROFILE=lab1
      - AWS_DEFAULT_REGION=us-east-1
      - PYTHONUNBUFFERED=1
    volumes:
      - ~/.aws:/root/.aws:ro
    networks:
      - iot-central-network

networks:
  iot-central-network:
    external: true
    name: iot-central-network
