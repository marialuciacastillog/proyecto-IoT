services:
  # Base de datos de la central: aquí vive global_inventory
  central_postgres_db:
    image: postgres:15-alpine
    container_name: db_central
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: central_db
    ports:
      - "5440:5432"
    volumes:
      # Estos .sql se ejecutan solos la primera vez que se crea la base
      - ../database/global_inventory.sql:/docker-entrypoint-initdb.d/01_global_inventory.sql:ro
      - ./processed_events.sql:/docker-entrypoint-initdb.d/02_processed_events.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d central_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Worker: lee sync-queue y actualiza global_inventory
  central_sync_worker:
    build: .
    container_name: central_sync_worker
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@central_postgres_db:5432/central_db
      - SYNC_QUEUE_URL=${SYNC_QUEUE_URL}
      - AWS_PROFILE=lab1
      - AWS_DEFAULT_REGION=us-east-1
      - PYTHONUNBUFFERED=1
    volumes:
      - ~/.aws:/root/.aws:ro
    depends_on:
      central_postgres_db:
        condition: service_healthy
