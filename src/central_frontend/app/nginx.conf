# Front central: sirve la página y reenvía /svc/... a las APIs de la central
# por la red de Docker iot-central-network (por nombre de contenedor, sin salir a internet).
server {
    listen 80;
    server_name localhost;

    # DNS interno de Docker. Con "set $destino" Nginx resuelve el nombre en cada petición,
    # así arranca aunque alguna API todavía no esté prendida (y no se cae si se reinicia).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API de reportes e inventario global (reports/, puerto 8000 de la máquina)
    location /svc/reports/ {
        # Los contratos se suben por aquí (máximo 10 MB por archivo)
        client_max_body_size 12m;
        set $reports_api iot-reports-api:8000;
        rewrite ^/svc/reports/(.*)$ /$1 break;
        proxy_pass http://$reports_api;
    }

    # API de transferencias (src/central_transfers, puerto 8010 de la máquina)
    location /svc/transfers/ {
        set $transfers_api central_transfers_api:8000;
        rewrite ^/svc/transfers/(.*)$ /$1 break;
        proxy_pass http://$transfers_api;
    }

    # Servicio de identidad (login y usuarios, src/central_identity, puerto 8008 de la máquina)
    location /svc/identity/ {
        set $identity_api central_identity:8000;
        rewrite ^/svc/identity/(.*)$ /$1 break;
        proxy_pass http://$identity_api;
    }

    # Catálogo (bodegas y productos, src/central_catalog, puerto 8007 de la máquina)
    location /svc/catalog/ {
        set $catalog_api central_catalog_api:8000;
        rewrite ^/svc/catalog/(.*)$ /$1 break;
        proxy_pass http://$catalog_api;
    }

    # Notificaciones y DLQ (src/central_notifications, puerto 8006 de la máquina)
    location /svc/notifications/ {
        set $notifications_api central_notifications_api:8000;
        rewrite ^/svc/notifications/(.*)$ /$1 break;
        proxy_pass http://$notifications_api;
    }

    # Servicio de ingesta IoT (src/iot/central, puerto 8005 de la máquina). Solo se usa /health
    location /svc/iot/ {
        set $iot_api iot_ingestion:8000;
        rewrite ^/svc/iot/(.*)$ /$1 break;
        proxy_pass http://$iot_api;
    }
}
