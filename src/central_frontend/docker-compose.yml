# Front de la central. Usa la red de la central para llegar a las APIs por nombre,
# así que se prende DESPUÉS de src/central_sync_worker (que crea la red).
services:
  central_frontend:
    build: ./app
    container_name: central_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      # Certificado HTTPS de la central (RNF-03)
      - ${TLS_DIR:-/opt/proyecto/secrets/tls}:/etc/nginx/tls:ro
    networks:
      - iot-central-network

networks:
  iot-central-network:
    external: true
    name: iot-central-network
