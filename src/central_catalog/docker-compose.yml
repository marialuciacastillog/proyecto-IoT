# Catálogo (bodegas y productos) en el puerto 8007 + publicador de avisos a las bodegas.
# Usa la base y la red de la central, así que se prende DESPUÉS de src/central_sync_worker.
services:
  catalog_api:
    build: .
    container_name: central_catalog_api
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@central_postgres_db:5432/central_db
      - JWT_PUBLIC_KEY_PATH=/secrets/jwt_public.pem
      - PYTHONUNBUFFERED=1
    volumes:
      - ${JWT_KEYS_DIR:-/opt/proyecto/secrets}:/secrets:ro
    ports:
      - "8007:8000"
    networks:
      - iot-central-network

  catalog_publisher:
    build: .
    container_name: central_catalog_publisher
    restart: unless-stopped
    command: python publisher.py
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@central_postgres_db:5432/central_db
      - AWS_PROFILE=lab1
      - AWS_DEFAULT_REGION=us-east-1
      - PYTHONUNBUFFERED=1
    volumes:
      - ${HOME}/.aws:/root/.aws:ro
    networks:
      - iot-central-network

networks:
  iot-central-network:
    external: true
    name: iot-central-network
